name: Activity Pulse
on:
  schedule:
    - cron: '31 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: m-chemlal
          filename: metrics.activity.svg
          template: classic
          base: ''
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_traffic: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          config_timezone: Africa/Casablanca
          config_padding: 0, 8 + 4%
          config_animations: yes
