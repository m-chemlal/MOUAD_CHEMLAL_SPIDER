
name: Activity Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Generate Activity Pulse
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: m-chemlal
          filename: metrics.activity.svg
          template: classic
          base: ""

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30

          config_timezone: Africa/Casablanca
          config_animations: yes
