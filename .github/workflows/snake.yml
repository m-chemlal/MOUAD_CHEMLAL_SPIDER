name: Animated Contribution Snake
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs from real contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: m-chemlal
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%238b5cf6
            dist/snake-dark.svg?palette=github-dark&color_snake=%23c4b5fd
      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
