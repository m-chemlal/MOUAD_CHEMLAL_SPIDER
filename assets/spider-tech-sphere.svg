<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SPIDER — Mouad Chemlal. Cybersecurity student at ENSIASD Taroudant and 1337 Coding School. Animated purple tech sphere featuring C, Python, Linux, Elastic, Wazuh, Docker, Cloud, AI Security, Nmap and Ping.">
